# Run `pre-commit install` once; after that these run on every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      # mypy runs through the project environment rather than a mirrors-mypy sandbox with a
      # hand-maintained dependency list. That list had drifted -- uvicorn, jinja2, pytest and
      # httpx were missing -- so the hook reported 28 import errors that CI never saw. Running
      # the same mypy CI runs is the only way the two stay in agreement.
      - id: mypy
        name: mypy (strict over src)
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: validate-portfolio
        name: validate the portfolio and the legacy tracker
        entry: python -c "import sys; sys.path.insert(0, 'src'); from article_reminders.cli.main import main; sys.exit(main(['validate']))"
        language: system
        pass_filenames: false
        files: ^data/
