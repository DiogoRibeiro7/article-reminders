name: Validate

# The sync workflows run on a schedule and treat the portfolio as the source of
# truth. Without this gate a malformed entry is discovered midway through a cron
# run that has already created or edited issues, so validation belongs on the way
# in -- along with the linter, the type checker, and the tests.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Poetry has to exist before setup-python, which keys its cache on poetry.lock.
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: poetry

      - name: Check that the lock file matches pyproject.toml
        run: poetry check --lock

      - name: Install the project
        run: poetry install --with dev --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy .

      - name: Validate the legacy tracker
        run: poetry run python scripts/validate_articles.py

      - name: Validate the portfolio
        run: poetry run article-reminders validate

      - name: Check that the example portfolio still builds
        run: |
          poetry run python examples/build_seed.py
          git diff --exit-code examples/

      - name: Run tests
        run: poetry run pytest
