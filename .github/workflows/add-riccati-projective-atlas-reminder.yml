name: Add Riccati projective atlas reminder

on:
  push:
    branches:
      - chore/add-riccati-projective-atlas-reminder
    paths:
      - .github/workflows/add-riccati-projective-atlas-reminder.yml

permissions:
  contents: write

jobs:
  add-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/add-riccati-projective-atlas-reminder

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install article-reminders
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Add paper to portfolio
        run: |
          article-reminders add "Riccati Equations as Projective Linear Dynamics: Equivalence Classes, Integrability, and Singularities" \
            --status research \
            --priority high \
            --repo DiogoRibeiro7/riccati-projective-atlas \
            --paper-path paper/ \
            --tags riccati,differential-equations,projective-geometry,integrability,linearization \
            --next-action "Formalize the canonical Riccati-to-linear transformation and prove the equivalence of the particular-solution, Bernoulli, and first-order-linear reductions before classifying Euler/log-time subclasses."

      - name: Refresh legacy export
        run: article-reminders legacy-export

      - name: Commit the data-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-riccati-projective-atlas-reminder.yml
          git add data/
          git commit -m "Track Riccati projective atlas paper"
          git push origin HEAD:chore/add-riccati-projective-atlas-reminder
