name: Temporary Gauss-Pareto compile harness

on:
  push:
    branches:
      - tmp-compile-gauss-pareto
    paths:
      - .github/workflows/tmp-compile-gauss-pareto.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out harness
        uses: actions/checkout@v7

      - name: Check private-repo token
        env:
          ARTICLE_SCAN_TOKEN: ${{ secrets.ARTICLE_SCAN_TOKEN }}
        run: |
          test -n "$ARTICLE_SCAN_TOKEN"

      - name: Clone exact manuscript head
        env:
          GH_TOKEN: ${{ secrets.ARTICLE_SCAN_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" clone https://github.com/DiogoRibeiro7/gauss-pareto-bridge.git manuscript
          cd manuscript
          git checkout d85cf42fa9a793e780dcbe1758565264e26078f2

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures

      - name: Compile manuscript
        working-directory: manuscript/paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          grep -E "(LaTeX Warning|Overfull|Underfull|Citation.*undefined|Reference.*undefined)" main.log || true

      - name: Upload PDF and log
        uses: actions/upload-artifact@v4
        with:
          name: gauss-pareto-manuscript-proof
          path: |
            manuscript/paper/main.pdf
            manuscript/paper/main.log
          retention-days: 1
