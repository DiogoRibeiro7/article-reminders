name: Register Gauss-Pareto bridge manuscript

on:
  push:
    branches:
      - add-gauss-pareto-bridge
    paths:
      - .github/workflows/register-gauss-pareto-bridge.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: add-gauss-pareto-bridge

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tracker
        run: python -m pip install .

      - name: Add manuscript to portfolio
        run: |
          article-reminders add 'A Gaussian–Pareto Bridge with Pure Power-Law Tails' \
            --status draft \
            --priority high \
            --repo DiogoRibeiro7/gauss-pareto-bridge \
            --paper-path paper/ \
            --authors 'Diogo Ribeiro' \
            --tags 'extreme-value-theory,heavy-tails,statistics,transformed-gaussian' \
            --abstract 'We study a transformed-Gaussian distribution family with locally Gaussian behaviour and regularly varying tails whose slowly varying factor converges to a finite positive constant. The construction cancels the leading Gaussian Mills-ratio correction, yields explicit higher-order cancellation points, and is analysed for finite-sample tail accessibility, likelihood geometry, and parameter recovery.' \
            --notes 'Active manuscript in gauss-pareto-bridge. The theorem-driven core, related-work boundary, numerical diagnostics, and repeated recovery experiments are in place. Novelty claims remain deliberately conservative while matched external benchmarks are developed.' \
            --next-action 'Complete the matched Tukey-h benchmark at equal tail index, comparing tail-ratio convergence, extreme-quantile error, and finite-sample tail accessibility.'
          article-reminders legacy-export
          article-reminders validate

      - name: Commit tracker data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/portfolio.json data/articles.json
          git commit -m 'Track Gauss-Pareto bridge manuscript'
          git push origin HEAD:add-gauss-pareto-bridge
