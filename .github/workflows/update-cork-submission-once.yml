name: Update cork submission once

on:
  push:
    paths:
      - ".github/workflows/update-cork-submission-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Update journal metadata
        run: >-
          poetry run article-reminders update
          "Material Heterogeneity, Moisture Dynamics and Bulk-Density Stability in Stopper-Grade Cork Granulates"
          --journal "European Journal of Wood and Wood Products"
          --notes "Complete first LaTeX draft and journal-specific submission package. Target classification corrected to Review Article: the paper is a quantitative/mechanistic synthesis with an identifiability framework and prospective experiment, not a new-experiment Original Article. Manuscript now includes affiliation, keywords, author contributions, data/code statement and generative-AI disclosure. Funding, competing interests, corresponding email, ORCID, exclusive-submission confirmation and archival DOI decision remain explicit blockers."
      - name: Update next action
        run: >-
          poetry run article-reminders next-action
          "Material Heterogeneity, Moisture Dynamics and Bulk-Density Stability in Stopper-Grade Cork Granulates"
          "Confirm funding, competing interests, corresponding email, ORCID and exclusive-submission status; decide and create the archival release/DOI; then insert final metadata and compile the submission PDF."
      - name: Export and validate
        run: |
          poetry run article-reminders legacy-export
          poetry run article-reminders validate
          poetry run python scripts/validate_articles.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/update-cork-submission-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/articles.json data/events.jsonl .github/workflows/update-cork-submission-once.yml
          git commit -m "chore: update cork submission metadata"
          git push
