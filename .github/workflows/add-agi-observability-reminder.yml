name: Add AGI observability reminder

on:
  push:
    branches:
      - chore/add-agi-observability-reminder
    paths:
      - .github/workflows/add-agi-observability-reminder.yml

permissions:
  contents: write

jobs:
  add-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/add-agi-observability-reminder

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install article-reminders
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Add paper to portfolio
        run: |
          article-reminders add "Physical Limits of General Intelligence: Observability, Embodiment, and Embedded Prediction" \
            --status research \
            --priority high \
            --repo DiogoRibeiro7/agi-observability-limits \
            --paper-path paper/ \
            --tags agi,decision-theory,observability,embedded-agency,physics \
            --next-action "Integrate the causal-horizon T5 theorem into the assembled manuscript, complete the theorem-by-theorem provenance audit, and adversarially stress-test the fixed task-class result before submission."

      - name: Refresh legacy export
        run: article-reminders legacy-export

      - name: Commit the data-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-agi-observability-reminder.yml
          git add data/
          git commit -m "Track AGI observability limits paper"
          git push origin HEAD:chore/add-agi-observability-reminder
