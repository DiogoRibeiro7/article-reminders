name: Register OECD Corporate Tax Cuts

on:
  push:
    branches:
      - register/oecd-corporate-tax-cuts

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: register/oecd-corporate-tax-cuts

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: poetry

      - name: Install project
        run: poetry install --with dev --no-interaction

      - name: Register research article
        run: |
          poetry run article-reminders add \
            "The Economic After-Effects of Corporate Income Tax Cuts Across OECD Economies" \
            --status research \
            --priority high \
            --repo DiogoRibeiro7/oecd-corporate-tax-cuts \
            --paper-path paper/ \
            --research-question "What happens to investment, FDI, wages, employment, productivity, profits, GDP and corporate-tax revenue after statutory corporate income tax cuts across OECD economies?" \
            --description "Cross-country OECD event-study project identifying statutory corporate income tax cuts and tracing their subsequent macroeconomic and fiscal effects using audited treatment dates, event-specific profiles and clean-control stacked designs." \
            --abstract "We study the economic after-effects of statutory corporate income tax cuts across OECD economies. Using OECD corporate tax-rate histories, we construct an audited inventory of policy events and examine the subsequent paths of investment, foreign direct investment, wages, employment, labour productivity, operating surplus, GDP and corporate-tax revenue. The empirical design separates transparent event-by-event profiles from pooled stacked event studies with clean control windows, repeated-treatment safeguards and pre-trend diagnostics. The analysis is designed to distinguish real-activity responses from fiscal-base and profit-shifting effects rather than treating any post-reform movement as causal by construction." \
            --notes "Active empirical project in oecd-corporate-tax-cuts. The treatment and stacked-event-study architecture is in place; the current work is constructing and auditing the OECD statutory-rate event inventory before outcome estimation." \
            --tags "corporate-tax,OECD,event-study,public-finance,causal-inference" \
            --authors "Diogo Ribeiro" \
            --next-action "Complete and audit the 2000-2026 OECD statutory corporate-tax-cut event inventory, then freeze the reviewed treatment table before adding the first outcome series."

      - name: Regenerate legacy tracker
        run: poetry run article-reminders legacy-export

      - name: Validate tracker
        run: |
          poetry run article-reminders validate
          poetry run python scripts/validate_articles.py

      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/register-oecd-corporate-tax-cuts.yml
          git add data/portfolio.json data/articles.json data/events.jsonl
          git commit -m "data: track OECD corporate tax cuts article"
          git push origin HEAD:register/oecd-corporate-tax-cuts
