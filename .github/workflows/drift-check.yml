name: Article drift check

# Compares every entry in data/articles.json against its actual repository and
# collects the disagreements into one issue. Monthly rather than weekly: drift
# here accumulates over months, and a quiet report stays worth reading.

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Most tracked repositories are private, and the default GITHUB_TOKEN is
      # scoped to this repository alone. Without a broader token every lookup
      # 404s, so skip with a notice rather than fail the run every month.
      - name: Check for a token that can read the tracked repositories
        id: token
        env:
          ARTICLE_SCAN_TOKEN: ${{ secrets.ARTICLE_SCAN_TOKEN }}
        run: |
          if [ -n "$ARTICLE_SCAN_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the drift check. Set the ARTICLE_SCAN_TOKEN secret to a token with read access to the tracked repositories to enable it."
          fi

      - name: Check article drift
        if: steps.token.outputs.present == 'true'
        env:
          ARTICLE_SCAN_TOKEN: ${{ secrets.ARTICLE_SCAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_article_drift.py
